<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilverLink - Your Friendly Companion</title>
    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-title">SilverLink</h1>
                <p class="sidebar-subtitle">Your friendly companion</p>
            </div>
            
            <div class="nav-menu">
                <ul>
                    <li class="nav-item">
                        <button class="nav-button active" onclick="showWelcome()">
                            <span class="nav-icon">🏠</span>
                            Home
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-button" onclick="showWeather()">
                            <span class="nav-icon">☀️</span>
                            Weather
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-button" onclick="showInstructions()">
                            <span class="nav-icon">📖</span>
                            Instructions
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-button" onclick="showConnect()">
                            <span class="nav-icon">👥</span>
                            Connect
                        </button>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <div id="app-content">
                <!-- Content will be dynamically loaded here -->
                <div class="welcome-content">
                    <h2>Welcome to SilverLink</h2>
                    <p>Your friendly companion for everyday support. Choose an option from the menu to get started.</p>
                    
                    <div class="card">
                        <h3 style="margin-bottom: 1rem; color: #4a5568;">What would you like to do today?</h3>
                        <p style="color: #718096; margin-bottom: 1.5rem;">Select from the menu on the left, or click one of these quick options:</p>
                        
                        <button class="btn btn-primary" onclick="showWeather()" style="margin-right: 1rem;">
                            ☀️ Check Weather
                        </button>
                        <button class="btn btn-secondary" onclick="showInstructions()">
                            📖 Get Help
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript files -->
    <script src="src/utils/helpers.js"></script>
    <script src="src/services/api.js"></script>
    <script src="src/components/ui.js"></script>
    <script src="src/app.js"></script>
</body>
</html>
